<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Invoice approvals{% endblock %} · Acme Traders</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/drafts">Acme Traders · Invoice approvals</a>
    {% if user %}
    <div class="who">
      <span>{{ user.name }} <span class="role role-{{ user.role }}">{{ user.role }}</span></span>
      <form method="post" action="/logout" class="inline">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button type="submit" class="link">Sign out</button>
      </form>
    </div>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>agent-approval-flow {{ version }} · drafts by an AI agent, decisions by people</footer>
</body>
</html>
