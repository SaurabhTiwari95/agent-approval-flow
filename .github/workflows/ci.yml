name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans every commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Pre-publish check (private words, IPs, emails, phones, AWS ids)
        env:
          BLOCKED_WORDS: ${{ secrets.BLOCKED_WORDS }}
        run: python scripts/prepublish_check.py
      - name: Secret scan (gitleaks, full history)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements-dev.txt

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests (no network, no API key, no cost), coverage gate 80%
        run: pytest --cov-fail-under=80
      - name: Docs (fenced languages, spacing, relative links and anchors; YAML parses)
        run: python scripts/check_docs.py

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Image runs as a non-root user
        run: |
          docker build -t agent-approval-flow:ci .
          test "$(docker run --rm --entrypoint id agent-approval-flow:ci -u)" = "10001"
      - name: Full stack smoke test (compose, offline extractor, sign in, approve, post)
        env:
          SMOKE_PASSWORD: ci-only-throwaway-password
        run: |
          HASH=$(printf '%s\n' "$SMOKE_PASSWORD" | python -m approval hash-password --stdin)
          cp .env.example .env
          sed -i "s|^APPROVERS=.*|APPROVERS='{\"dana\": {\"name\": \"Dana Whitfield\", \"hash\": \"$HASH\", \"role\": \"approver\"}}'|" .env
          docker compose up -d --build --wait web
          curl -fsS http://127.0.0.1:8010/readyz
          python scripts/smoke.py --url http://127.0.0.1:8010 --username dana
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down -v

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-path .github "./**/*.md"
          fail: true
